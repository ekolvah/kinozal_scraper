name: Kinozal egress probe (temporary, branch-only)

on:
  workflow_dispatch:
  push:
    branches:
      - probe/kinozal-egress

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Runner egress identity
        run: |
          curl -sS --max-time 15 https://ipinfo.io/json || true
          echo

      - name: DNS
        run: |
          for h in kinozal.tv kinozal.guru; do
            echo "== $h"
            getent ahosts "$h" || echo "(no resolution)"
          done

      - name: Plain curl (status / remote ip / connect time / headers / body head)
        run: |
          set +e
          for h in kinozal.tv kinozal.guru; do
            url="https://$h/top.php?j=&t=0&d=14&k=0&f=0&w=0&s=0"
            echo "================ $url"
            curl -sS --max-time 20 -o "/tmp/$h.body" -D "/tmp/$h.headers" \
              -w 'http_code=%{http_code} remote_ip=%{remote_ip} time_connect=%{time_connect} time_total=%{time_total}\n' \
              "$url" 2>&1
            echo "---- headers"
            cat "/tmp/$h.headers" 2>/dev/null
            echo "---- body head"
            head -c 800 "/tmp/$h.body" 2>/dev/null | tr '\n' ' '
            echo
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: curl_cffi chrome-impersonate, 3 attempts 60 s apart (production transport)
        run: |
          python -m pip install -q curl_cffi==0.15.0
          python - <<'PY'
          import time
          from curl_cffi import requests

          URLS = [
              "https://kinozal.tv/top.php?j=&t=0&d=14&k=0&f=0&w=0&s=0",
              "https://kinozal.guru/top.php?j=&t=0&d=14&k=0&f=0&w=0&s=0",
          ]
          SHOW = ("server", "cf-ray", "cf-mitigated", "cf-cache-status", "location", "content-type", "via")
          for attempt in range(1, 4):
              for url in URLS:
                  t0 = time.monotonic()
                  try:
                      r = requests.get(url, impersonate="chrome", timeout=20, allow_redirects=False)
                      ms = int((time.monotonic() - t0) * 1000)
                      print(f"[{attempt}] {url} -> {r.status_code} ({ms} ms)")
                      for k in SHOW:
                          if k in r.headers:
                              print(f"      {k}: {r.headers[k]}")
                      print("      body:", r.text[:400].replace("\n", " "))
                  except Exception as exc:  # noqa: BLE001 — probe prints everything
                      ms = int((time.monotonic() - t0) * 1000)
                      print(f"[{attempt}] {url} -> EXC {type(exc).__name__} ({ms} ms): {exc}")
              if attempt < 3:
                  time.sleep(60)
          PY
