# Временный измеритель доступности soldout из CI (#396) — удалить вместе с
# scripts/probe.py после решения по обходу. Забыть не даст hard-expiry в самом
# скрипте: после зашитой даты шаг краснеет и требует удаления.
#
# Намеренно НЕ гейт: 403 — результат измерения, а не сбой, поэтому прогон зелёный.
# Красным он становится только при сбое самого инструмента (см. probe.py).
name: soldout probe

on:
  schedule:
    # 8 запусков × 3 попытки = 24 замера/сутки — суточная сетка, на которой
    # читается решающее правило «был ли ≥1 успех в каждые сутки».
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Пробник ничего не отправляет: ни одного secrets.*, ни Telegram, ни Sheets.
# Это и есть его смысл — до него единственный способ дёрнуть fetch из датацентра
# был прогнать run-script.yml, который рассылает в канал.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe
        run: python scripts/probe.py
        env:
          PROBE_URL: ${{ vars.SOLDOUT_URL }}
