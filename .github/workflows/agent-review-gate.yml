name: Agent review gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# This workflow intentionally executes only the default branch's verifier.
# Do not checkout or run code from the pull request here.
permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  agent-review-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Verify trusted review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python trusted/scripts/check_claude_review.py
          --repo ${{ github.repository }}
          --pr ${{ github.event.pull_request.number }}
          --head-sha ${{ github.event.pull_request.head.sha }}
          --wait-seconds 360
