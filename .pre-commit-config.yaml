default_install_hook_types: [pre-push]
repos:
  # agent-process:begin
  - repo: https://github.com/ekolvah/agent-process-distribution
    rev: v3.10.1
    hooks:
      - id: quality
  # agent-process:end
  # Edit-time lint (the plugin's edit_lint) and `ci_check lint` run this `pre-commit` stage;
  # the `rev` is ruff's only pin (#628).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]
