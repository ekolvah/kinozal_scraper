<html>
        <head><meta charset="utf-8"><title>Just a moment...</title></head>
        <body>
            <script>
                document.cookie = "challenge1=1; path=/; max-age=300; SameSite=Lax";

                const urlParams = new URLSearchParams(window.location.search);
                const nextUrl = urlParams.get("next") || "/";

                if (nextUrl.startsWith("/") && !nextUrl.startsWith("//")) {
                    window.location.href = nextUrl;
                } else {
                    window.location.href = "/";
                }
            </script>
            <noscript>For this site to function correctly, you must enable JavaScript in your browser settings.</noscript>
        </body>
        </html>
